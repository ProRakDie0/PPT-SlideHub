<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlideHub — Библиотека слайдов</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <!-- PptxGenJS для генерации PPTX -->
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>
  <!-- Шапка -->
  <div class="header">
    <h2>📑 SlideHub <span class="badge">Финансы</span></h2>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Обновить каталог">🔄</button>
      <button class="icon-btn" id="historyBtn" title="История">📊</button>
    </div>
  </div>

  <!-- Поиск -->
  <input type="text" class="search-box" id="searchInput" placeholder="Поиск по названию или описанию..." autofocus>

  <!-- Фильтры -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-category="all">Все</button>
    <button class="filter-btn" data-category="analytics">Аналитика</button>
    <button class="filter-btn" data-category="finance">Финансы</button>
    <button class="filter-btn" data-category="roadmap">Roadmap</button>
    <button class="filter-btn" data-category="team">Команда</button>
    <button class="filter-btn" data-category="summary">Итоги</button>
  </div>

  <!-- Статистика -->
  <div class="stats" id="statsContainer">
    <span>Всего: <strong id="totalCount">0</strong></span>
    <span>Показано: <strong id="shownCount">0</strong></span>
  </div>

  <!-- Каталог -->
  <div class="catalog" id="catalogContainer"></div>

  <!-- История -->
  <div class="history-panel" id="historyPanel" style="display:none;">
    <h3>📋 Недавно использованные</h3>
    <div id="historyList"></div>
  </div>

  <!-- Уведомления -->
  <div id="notification" class="notification"></div>

  <!-- Скрипты -->
  <script src="js/notifications.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/pptx-generator.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/insert.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
